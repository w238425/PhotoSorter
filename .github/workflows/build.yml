name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode 16
        run: |
          XC16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "using $XC16"
          sudo xcode-select -s "$XC16"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download CLIP CoreML models (~300MB)
        run: |
          set -e
          BASE="https://huggingface.co/InspiratioNULL/CLIP-VIT-B-32-DataComp.XL-CoreML/resolve/main"
          R="PhotoSorter/Resources"
          mkdir -p "$R/CLIP_ImageEncoder.mlmodelc/analytics" "$R/CLIP_ImageEncoder.mlmodelc/weights" \
                   "$R/CLIP_TextEncoder.mlmodelc/analytics" "$R/CLIP_TextEncoder.mlmodelc/weights" \
                   "$R/Tokenizer"
          for enc in CLIP_ImageEncoder CLIP_TextEncoder; do
            for f in analytics/coremldata.bin coremldata.bin metadata.json model.mil weights/weight.bin; do
              if [ ! -s "$R/$enc.mlmodelc/$f" ]; then
                echo "downloading $enc/$f"
                curl -fsSL --retry 3 "$BASE/$enc.mlmodelc/$f" -o "$R/$enc.mlmodelc/$f"
              fi
            done
          done
          [ -s "$R/Tokenizer/vocab.json" ] || curl -fsSL --retry 3 "$BASE/vocab.json" -o "$R/Tokenizer/vocab.json"
          [ -s "$R/Tokenizer/merges.txt" ] || curl -fsSL --retry 3 "$BASE/merges.txt" -o "$R/Tokenizer/merges.txt"
          echo "=== sizes ==="
          du -sh "$R"/*
          wc -c "$R/Tokenizer/vocab.json" "$R/CLIP_ImageEncoder.mlmodelc/weights/weight.bin" "$R/CLIP_TextEncoder.mlmodelc/weights/weight.bin"
          # 防呆：权重小于 50MB 说明下载失败
          IMG=$(wc -c < "$R/CLIP_ImageEncoder.mlmodelc/weights/weight.bin")
          TXT=$(wc -c < "$R/CLIP_TextEncoder.mlmodelc/weights/weight.bin")
          if [ "$IMG" -lt 50000000 ] || [ "$TXT" -lt 50000000 ]; then
            echo "::error::模型权重下载异常 img=$IMG txt=$TXT"
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "===== ls root ====="
          ls -la
          echo "===== ls xcodeproj ====="
          ls -la PhotoSorter.xcodeproj || echo "NO XCODEPROJ"
          echo "===== xcodebuild -list ====="
          xcodebuild -list -project PhotoSorter.xcodeproj || echo "LIST FAILED"
          echo "===== pbxproj head ====="
          head -20 PhotoSorter.xcodeproj/project.pbxproj || echo "NO PBXPROJ"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoSorter.xcodeproj \
            -scheme PhotoSorter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build_full.log

      - name: Expose errors as annotations
        if: failure()
        run: |
          echo "===== TAIL OF BUILD LOG ====="
          tail -60 build_full.log || true
          grep -nE "error:|xcodebuild: error|\*\* BUILD" build_full.log | head -30 | while read -r line; do
            echo "::error::${line:0:400}"
          done

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/PhotoSorter.app" Payload/
          zip -qry PhotoSorter-unsigned.ipa Payload
          ls -lh PhotoSorter-unsigned.ipa

      - name: Diagnose missing resources
        if: always()
        run: |
          {
            echo "=== Resources dir ==="
            du -sh PhotoSorter/Resources/* 2>&1
            echo "=== App bundle mlmodelc/json ==="
            find build/Build/Products -maxdepth 3 \( -name "*.mlmodelc" -o -name "vocab.json" -o -name "labels_default.json" \) 2>&1
            echo "=== App bundle total ==="
            du -sh build/Build/Products/Release-iphoneos/PhotoSorter.app 2>&1
            echo "=== pbxproj references ==="
            grep -c "mlmodelc" PhotoSorter.xcodeproj/project.pbxproj 2>&1
            grep -m3 "mlmodelc" PhotoSorter.xcodeproj/project.pbxproj 2>&1
          } | head -25 | while IFS= read -r line; do echo "::error::${line:0:380}"; done

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-ipa
          path: PhotoSorter-unsigned.ipa

  # 人体解析模型转换：best effort，失败不阻塞出包
  convert-parsing:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install converters
        run: |
          python -m pip install --upgrade pip
          python -m pip install coremltools onnx

      - name: Convert SegFormer-B2 human parsing to CoreML
        run: python tools/convert_parsing.py HumanParsing.mlpackage

      - name: Upload parsing model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HumanParsing-mlpackage
          path: HumanParsing.mlpackage
