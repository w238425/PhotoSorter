name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "===== ls root ====="
          ls -la
          echo "===== ls xcodeproj ====="
          ls -la PhotoSorter.xcodeproj || echo "NO XCODEPROJ"
          echo "===== xcodebuild -list ====="
          xcodebuild -list -project PhotoSorter.xcodeproj || echo "LIST FAILED"
          echo "===== pbxproj head ====="
          head -20 PhotoSorter.xcodeproj/project.pbxproj || echo "NO PBXPROJ"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoSorter.xcodeproj \
            -scheme PhotoSorter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build_full.log

      - name: Expose errors as annotations
        if: failure()
        run: |
          echo "===== TAIL OF BUILD LOG ====="
          tail -60 build_full.log || true
          grep -nE "error:|xcodebuild: error|\*\* BUILD" build_full.log | head -30 | while read -r line; do
            echo "::error::${line:0:400}"
          done

      - name: Diagnostics as annotations
        if: always()
        run: |
          {
            echo "===LS==="
            ls -la
            echo "===XCODEPROJ==="
            ls -la PhotoSorter.xcodeproj 2>&1
            echo "===LIST==="
            xcodebuild -list -project PhotoSorter.xcodeproj 2>&1
            echo "===PBXPROJ HEAD==="
            head -15 PhotoSorter.xcodeproj/project.pbxproj 2>&1
            echo "===XCODEGEN VERSION==="
            xcodegen --version 2>&1
            echo "===YML==="
            cat project.yml
          } | head -60 | while IFS= read -r line; do
            echo "::error::${line:0:380}"
          done

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/PhotoSorter.app" Payload/
          zip -qry PhotoSorter-unsigned.ipa Payload
          ls -lh PhotoSorter-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-ipa
          path: PhotoSorter-unsigned.ipa
